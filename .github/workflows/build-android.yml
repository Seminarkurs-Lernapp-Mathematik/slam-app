name: Build Flutter Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "❌ Secret GOOGLE_SERVICES_JSON_B64 is not set in repository settings"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          # Validate JSON and print the package name for easy diagnosis
          python3 - <<'EOF'
import json, sys
with open('android/app/google-services.json') as f:
    data = json.load(f)
clients = data.get('client', [])
names = [c.get('client_info', {}).get('android_client_info', {}).get('package_name', '?') for c in clients]
print(f"✅ google-services.json decoded — registered packages: {names}")
EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK (release, debug-signed)
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=https://api.learn-smart.app \
            --dart-define=ENVIRONMENT=production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slam-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle \
            --release \
            --dart-define=API_BASE_URL=https://api.learn-smart.app \
            --dart-define=ENVIRONMENT=production

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: slam-app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Post-build summary
        if: success()
        run: |
          echo "✅ Android build successful!"
          echo "📦 APK: build/app/outputs/flutter-apk/app-release.apk"
          echo "📦 AAB: build/app/outputs/bundle/release/app-release.aab"
